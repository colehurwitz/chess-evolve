[project]
name = "chess-evolve"
version = "0.1.0"
description = "Teach an LLM to play chess via evolutionary prompt optimization — a demo of remote-factory as a library"
requires-python = ">=3.11"
dependencies = [
    "remote-factory @ git+https://github.com/akashgit/remote-factory.git@factory/run-3110c50a",
    "python-chess",
    "anthropic[vertex]",
]

[project.scripts]
chess-evolve = "chess_evolve.cli:main"

[project.optional-dependencies]
dashboard = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sse-starlette>=1.6.5",
    "watchfiles>=0.20.0",
    "jinja2>=3.1.0",
]
dev = ["pytest", "pytest-timeout", "pytest-asyncio", "httpx", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/chess_evolve"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"src/chess_evolve/serve.py" = ["E501"]
"src/chess_evolve/dashboard/app.py" = ["E501"]
